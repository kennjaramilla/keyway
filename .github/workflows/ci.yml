name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality (lint, format, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  unit:
    name: Unit tests (coverage)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: E2E (Cypress on production build)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: cypress-io/github-action@v7
        with:
          build: npm run build
          start: npm run start:e2e
          wait-on: http://localhost:3100
          wait-on-timeout: 120
          browser: chrome
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

  e2e-real-api:
    name: E2E (Cypress on the real API)
    needs: quality
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      KEYWAY_API_URL: http://localhost:4000
      MONGODB_URI: mongodb://localhost:27017/keyway
      CYPRESS_REAL_API: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kennjaramilla/keyway-api
          path: keyway-api
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            keyway-api/package-lock.json
      - name: Start the API
        working-directory: keyway-api
        run: |
          npm ci
          npm run build
          nohup node dist/main.js > api.log 2>&1 &
          npx wait-on -t 60000 http://localhost:4000/api/health
      - uses: cypress-io/github-action@v7
        with:
          build: npm run build
          start: npm run start:e2e
          wait-on: http://localhost:3100
          wait-on-timeout: 120
          browser: chrome
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-real-api
          path: |
            cypress/screenshots
            keyway-api/api.log
          retention-days: 7

  storybook:
    name: Storybook build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - run: npm run build-storybook -- --quiet

  # SonarQube: enable by removing `if: false` and adding SONAR_TOKEN and
  # SONAR_HOST_URL secrets plus a sonar-project.properties file. It reuses the
  # lcov report from the unit job.
  sonarqube:
    name: SonarQube (disabled)
    if: false
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # Black Duck (SCA): enable by removing `if: false` and adding BLACKDUCK_URL
  # and BLACKDUCK_API_TOKEN secrets. Scans npm dependencies for licence and
  # vulnerability policy violations.
  blackduck:
    name: Black Duck SCA (disabled)
    if: false
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: blackduck-inc/black-duck-security-scan@v2
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
